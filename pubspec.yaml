name: unlimitedsubs_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.1+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_riverpod: ^2.5.1
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  flutter_cache_manager: ^3.4.1
  webview_flutter: ^4.13.0
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3
  shimmer_animation: ^2.2.2
  shimmer: ^3.0.0
  webview_flutter_android: ^4.10.5
  webview_flutter_wkwebview: ^3.23.2
  flutter_markdown: ^0.7.7+1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/


flutter_launcher_icons:
  android: true                 # Genera íconos para Android
  ios: true                     # Genera íconos para iOS
  image_path: "assets/images/logo.jpg" # <-- Ruta a tu logo principal
  adaptive_icon_background: "#0D1117" # <-- ¡Nuestro color azul marino!
  adaptive_icon_foreground: "assets/images/logo.jpg" # Tu logo de nuevo
